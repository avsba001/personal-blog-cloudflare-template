name: Verify template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck --workspace=backend
      - run: npx wrangler d1 migrations apply DB --local
      - name: Confirm no preset administrator can log in
        run: |
          npx wrangler d1 execute DB --local --json --command="SELECT count(*) AS n FROM users WHERE id > 0 AND role = 'admin'" |
            jq -e '.[0].results[0].n == 0'
      - run: npx wrangler deploy --dry-run
