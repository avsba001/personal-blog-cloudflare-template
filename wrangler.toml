name = "blog"
main = "backend/src/index.ts"
workers_dev = true
compatibility_date = "2024-01-01"
# 静态资源挂到同一 Worker 后，导航请求（浏览器深链）优先交给静态资源、
# 不进入 Worker，避免 Hono 的 JSON 404 覆盖 SPA 的 index.html。
# 保持 compatibility_date 不变，避免既有运行时行为发生变化。
compatibility_flags = ["assets_navigation_prefers_asset_serving"]

# 前端静态资源（Vite 产物），与 API 同域部署
[assets]
directory = "frontend/dist"
run_worker_first = ["/api/*"]
binding = "ASSETS"
not_found_handling = "single-page-application"


# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
# 部署按钮会将占位 ID 替换为部署者的数据库 ID。
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "database"

# KV 缓存
[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

# R2 存储
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "blog-storage"

# Durable Object - 原子限流计数器
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# 日志配置
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# 定时任务触发器（每 15 分钟扫描一次到期汇总，daily / weekly 在同一任务内处理）
[triggers]
crons = ["*/15 * * * *"]

# 环境变量（公开的配置）
[vars]
ENVIRONMENT = "production"
# 可选：邮件中的链接使用 FRONTEND_URL；默认同域提供 R2 文件。
# FRONTEND_URL = "https://blog.example.com"
# STORAGE_PUBLIC_URL = "https://storage.example.com"

# Secrets（需要通过命令行或Cloudflare Dashboard设置）
# wrangler secret put JWT_SECRET
# wrangler secret put POST_PASSWORD_SECRET  # 文章密码访问 Token 密钥（可选，默认使用 JWT_SECRET）
# wrangler secret put GITHUB_CLIENT_ID
# wrangler secret put GITHUB_CLIENT_SECRET

# 或者在Cloudflare Dashboard设置:
# Workers & Pages > blog > Settings > Variables
# 添加以下环境变量（加密）：
# - JWT_SECRET: 用户认证 JWT 密钥
# - POST_PASSWORD_SECRET: 文章密码访问 Token 密钥（可选）
# - GITHUB_CLIENT_ID: GitHub OAuth Client ID
# - GITHUB_CLIENT_SECRET: GitHub OAuth Client Secret
